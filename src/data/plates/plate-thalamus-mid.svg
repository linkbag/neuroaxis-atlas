    <!-- v19 (audit FAC-TR-001 / rendering plate-2): the two vertical letters were
         swapped. The artwork draws the most-posterior structure (nuc-pulvinar,
         origin3d z = -5.5) at cy = 244 and the most-anterior (nuc-ventromedial,
         z = +6.0) at cy = 588 — measured correlation corr(cy, z) = +0.78 over 49
         labelled shapes — i.e. anterior is at the BOTTOM, as in the other eight
         transverse plates (P top / A bottom). The frame now agrees with the
         drawing underneath it. -->
    <circle cx="400" cy="738" r="17" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/><text x="400" y="743.5" text-anchor="middle" font-size="15" font-weight="700" fill="#475569">A</text>
  </g>
