name: Review scientific content
on:
  pull_request:
    branches: [master]
permissions:
  contents: read
jobs:
  review-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run validate
      - run: npm run verify:scientific
      - run: npm run verify:imaging-fit
      - run: npm run verify:public-imaging
      - run: npm run build
      - run: node scripts/verify/public-imaging.mjs --dist
